name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Prepare static files for GitHub Pages
        run: |
          # Prevent Jekyll from ignoring files with underscores
          touch dist/.nojekyll
          # Fallback 404 for SPA routing
          cp dist/index.html dist/404.html

      # Deploys directly to gh-pages branch (bypasses GitHub Pages 404 API restrictions)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
